# Price Robot: every 30 minutes, reads the private Master Sheet,
# keeps only selling prices, encrypts them and publishes the site.
name: Price Robot

on:
  schedule:
    - cron: "*/30 * * * *"     # UTC; GitHub may run it a little late when busy
  workflow_dispatch:            # "Run workflow" button for urgent updates
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "robot/**"
      - ".github/workflows/price-robot.yml"

permissions:
  contents: write    # save the encrypted file
  pages: write       # publish the site
  id-token: write    # required by GitHub Pages

concurrency:
  group: price-robot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.robot.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt

      - name: Install robot
        run: pip install -r robot/requirements.txt

      - name: Read sheet, keep 5 fields, encrypt
        id: robot
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_SALT: ${{ secrets.SITE_SALT }}
        run: python robot/sync.py

      - name: Save the new encrypted file (only when something changed)
        if: steps.robot.outputs.changed == 'true'
        run: |
          git config user.name "price-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.enc.json docs/heartbeat.txt
          git commit -m "Price Robot: update"
          git push

      - name: Package the site
        if: steps.robot.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

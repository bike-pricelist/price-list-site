<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#9B2533">
  <title>Spares Price List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Lock screen -->
  <main id="lock" class="lock" hidden>
    <form id="lock-form" class="lock-card" autocomplete="on">
      <img src="icon-192.png" alt="" class="lock-icon" width="56" height="56">
      <h1>Spares Price List</h1>
      <p class="muted">Enter the password once. This phone will remember it.</p>
      <label for="pw" class="sr-only">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button id="unlock" type="submit">Unlock</button>
      <p id="lock-msg" class="lock-msg" role="alert"></p>
      <p class="muted small">Don't have the password? Ask the office.</p>
    </form>
  </main>

  <!-- Message screen (no data / offline with no copy) -->
  <main id="message" class="lock" hidden>
    <div class="lock-card">
      <img src="icon-192.png" alt="" class="lock-icon" width="56" height="56">
      <h1 id="message-title">Spares Price List</h1>
      <p id="message-text" class="muted"></p>
    </div>
  </main>

  <!-- Price list -->
  <div id="app" hidden>
    <header class="top">
      <div class="title-row">
        <div>
          <h1>Spares Price List</h1>
          <p id="updated" class="muted small"></p>
        </div>
        <button id="lock-btn" class="icon-btn" type="button" title="Lock this phone" aria-label="Lock this phone">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 0 1 6 0v3H9Z"/></svg>
        </button>
      </div>
      <div id="offline" class="offline" hidden>Offline: showing the last saved prices</div>
      <div class="search-row">
        <input id="q" type="search" placeholder="Search part no. or name" autocomplete="off" enterkeyhint="search" aria-label="Search part number or name">
        <select id="brand" aria-label="Brand"><option value="">All brands</option></select>
      </div>
      <p id="count" class="muted small" aria-live="polite"></p>
    </header>
    <ul id="list" class="list"></ul>
    <p id="more" class="muted small center" hidden></p>
  </div>
</body>
</html>
